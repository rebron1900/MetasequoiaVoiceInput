name: Build and Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install vcpkg dependencies
        shell: pwsh
        run: |
          & "C:\vcpkg\vcpkg.exe" install --triplet x64-windows-static --x-manifest-root . --x-install-root "${{ github.workspace }}\vcpkg_installed"

      - name: Configure CMake
        shell: pwsh
        run: >
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=x64-windows-static

      - name: Build Release binary
        run: cmake --build build --config Release --parallel

      - name: Package portable release
        shell: pwsh
        run: |
          cmake --install build --config Release --prefix package/MetasequoiaVoiceInput
          $loader = Get-ChildItem -Path vcpkg_installed -Filter WebView2Loader.dll -Recurse | Select-Object -First 1
          if ($null -eq $loader) { throw "vcpkg did not provide WebView2Loader.dll" }
          Copy-Item $loader.FullName "package/MetasequoiaVoiceInput/WebView2Loader.dll"
          $requiredFiles = @(
            "package/MetasequoiaVoiceInput/MetasequoiaVoiceInput.exe",
            "package/MetasequoiaVoiceInput/WebView2Loader.dll",
            "package/MetasequoiaVoiceInput/templates/config.toml",
            "package/MetasequoiaVoiceInput/audios/start.mp3",
            "package/MetasequoiaVoiceInput/audios/end.mp3",
            "package/MetasequoiaVoiceInput/html/settings.html"
          )
          $requiredFiles | ForEach-Object {
            if (-not (Test-Path $_)) { throw "Release package is missing required file: $_" }
          }
          Compress-Archive -Path package/MetasequoiaVoiceInput/* -DestinationPath package/MetasequoiaVoiceInput-windows-x64.zip

      - name: Upload portable build
        uses: actions/upload-artifact@v4
        with:
          name: MetasequoiaVoiceInput-windows-x64
          path: package/MetasequoiaVoiceInput-windows-x64.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download portable build
        uses: actions/download-artifact@v4
        with:
          name: MetasequoiaVoiceInput-windows-x64
          path: release

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release/MetasequoiaVoiceInput-windows-x64.zip
