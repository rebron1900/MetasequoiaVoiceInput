# 兼容旧版本的镜像配置；新版本请使用下方 profiles。
[asr_api]
endpoint = "https://api.siliconflow.cn/v1/audio/transcriptions"
provider = "cloud_siliconflow"
token = ""
model = "TeleAI/TeleSpeechASR"

[polish_api]
endpoint = "https://api.siliconflow.cn/v1/chat/completions"
provider = "siliconflow"
token = ""
model = "Qwen/Qwen3-8B"

[asr_profiles.default]
provider = "cloud_siliconflow"
endpoint = "https://api.siliconflow.cn/v1/audio/transcriptions"
token = ""
model = "TeleAI/TeleSpeechASR"

# 本地 Whisper 示例：将 provider 改为 local_whisper，model 填 ggml 模型相对程序目录的路径。
# [asr_profiles.local-whisper]
# provider = "local_whisper"
# endpoint = ""
# token = ""
# model = "models/ggml-base.bin"

[polish_profiles.default]
provider = "siliconflow"
endpoint = "https://api.siliconflow.cn/v1/chat/completions"
token = ""
model = "Qwen/Qwen3-8B"

# 基础设置
[settings]
active_asr_profile = "default"
active_polish_profile = "default"
# 开发阶段建议开启，日志写入程序目录 logs/。
debug_logging = true
log_file = "logs/metasequoia-voice-input.log"
# 偏好语言
language = "zh-cn"
# 触发时是否播放提示音
notification_sound = true
# 上屏前是否要先进行文本润色
polish_text = false
# ASR 传输方式：cloud_siliconflow（HTTP 文件转写）或 json_websocket_streaming（统一 JSON WebSocket 流式协议）
stt_provider = "cloud_siliconflow"
# 流式模式每个 PCM16 binary frame 的时长，范围 20-200
streaming_chunk_ms = 40
# 文本输出方式：send_input 或 clipboard_paste
output_method = "send_input"
